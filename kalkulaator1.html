<!doctype html>
<html>
  <head>
    <title>Joonistuspaberi hinnaleidja</title>
    <script>
      function arvutus(){
        vastus.innerText="Maksab "+(kogus.valueAsNumber*60)+" senti";
      }
    </script>
  </head>
  <body>
    Lehe hind on ca 60 senti. Mitu lehte? <br />
    <input type="number" id="kogus" />
    <input type="button" value="arvuta" onclick="arvutus()" />
    <span id="vastus">vastuse koht</span> <br />
    <img src="untitled.png" />
  </body>
</html>
