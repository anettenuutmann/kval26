<!DOCTYPE html>
<html>
  <head>
    <title>Minu Hiiumaa kaart</title>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.5.1/leaflet.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.5.1/leaflet.css" />

    <style>
      body { padding: 0; margin: 0; }
      html, body { height: 100%; width: 100%; }
      #kaardikiht { width: 100%; height: 100%; }
    </style>

    <script>
      var kaart;

      function algus(){
        kaart = L.map('kaardikiht').setView([58.9, 22.6], 10);

        new L.TileLayer(
          'https://tiles.maaamet.ee/tm/tms/1.0.0/hybriid@GMC/{z}/{x}/{y}.png&ASUTUS=TLU&ERIALA=DIGIHUMANITAARIA', {
            attribution: "Map: <a href='http://www.maaamet.ee/'>Maa-amet</a>",
            tms: true
          }
        ).addTo(kaart);

        L.marker([59.001257, 22.744203]).addTo(kaart)
          .bindPopup("Kärdla – maja");

        L.marker([58.79338, 22.835255]).addTo(kaart)
          .bindPopup("Kassari – rand");

        L.marker([58.831337, 22.779808]).addTo(kaart)
          .bindPopup("Käina – pood");

        L.marker([58.916111, 22.198610]).addTo(kaart)
          .bindPopup("Kõpu tuletorn");

        L.marker([58.770052, 22.815455]).addTo(kaart)
          .bindPopup("Sääretirp");
      }
    </script>
  </head>

  <body onload="algus()">
    <div id="kaardikiht"></div>
  </body>
</html>
