<!DOCTYPE html>
<html>
  <head>
    <title>Teated</title>
    <script>
       function loe(){
         fetch("https://script.google.com/macros/s/AKfycbw4vDAVqihMMNcpbdZrZ68O3BSlGLWUdduwb9oRM1xcaXQHVodRHdCT5PSRwI3aA1Qk/exec"
                ).then(d => d.json()).then(kuva);
     }
       function kuva(tekst){
          console.log(tekst);
          v1.innerText=tekst;
          p1.innerText=tekst[0];
          s1.innerText=tekst[1];
       }
    </script>
  </head>
  <body>
    Teade: <span id="v1">teate koht</span>
    <input type="button" value="Kuva teade" onclick="loe()"/>
    <h1 id="p1">Pealkirja koht</h1>
    <div id="s1">sisu koht</div>
  </body>
</html>
