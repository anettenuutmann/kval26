<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Hiiumaa kaart</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.5.1/leaflet.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.5.1/leaflet.css" />

    <script>
      let kaart;
      let hypik;
      let grupp;
      let valitudkoht;
      let kohad = [];

      let aadress = "https://script.google.com/macros/s/AKfycbwTZWUCvoDEbHj0QGU4c1vL5Sk20HzcqUTxf8d6r0wHdIERk9GMCaz780a52yulWqQS/exec";

      function algus(){
        kaart = L.map('kaardikiht').setView([58.9, 22.6], 10);

        new L.TileLayer(
          'https://tiles.maaamet.ee/tm/tms/1.0.0/hybriid@GMC/{z}/{x}/{y}.png&ASUTUS=TLU&ERIALA=DIGIHUMANITAARIA', {
            attribution: "Maa-amet",
            tms: true
          }
        ).addTo(kaart);

        grupp = L.layerGroup().addTo(kaart);
        hypik = L.popup();
        kaart.on("click", vajutus);
        loe();
      }

      function loe(){
        fetch(aadress).then(d => d.json()).then(kuva);
      }

      function kuva(andmed){
        kohad = andmed;
        grupp.clearLayers();

        for(let i = 0; i < kohad.length; i++){
          L.marker([kohad[i][0], kohad[i][1]])
            .addTo(grupp)
            .bindPopup(kohad[i][2] + " – " + kohad[i][3]);
        }

        if(valitudkoht){
          kaugused();
        }
      }

      function vajutus(e){
        valitudkoht = e.latlng;

        hypik.setLatLng(valitudkoht)
          .setContent("Valitud koht")
          .openOn(kaart);

        kaugused();
      }

      function kaugused(){
        let tekst = "";

        for(let i = 0; i < kohad.length; i++){
          let koht = L.latLng(kohad[i][0], kohad[i][1]);
          let kaugus = valitudkoht.distanceTo(koht) / 1000;

          tekst += kohad[i][2] + ": " +
            kaugus.toFixed(2) + " km\n";
        }

        vastus.innerText = tekst;
      }

      function salvesta(){
        if(valitudkoht){
          let lisand = "?laiuskraad=" + valitudkoht.lat +
            "&pikkuskraad=" + valitudkoht.lng +
            "&tyyp=" + encodeURIComponent(tyyp.value) +
            "&kommentaar=" + encodeURIComponent(kommentaar.value);

          fetch(aadress + lisand).then(d => d.json()).then(kuva);
        }
      }
    </script>
  </head>

  <body onload="algus()">
    Koha nimi: <input type="text" id="tyyp" />
    Kirjeldus: <input type="text" id="kommentaar" />
    <input type="button" value="Salvesta" onclick="salvesta()" />
    <input type="button" value="Uuenda" onclick="loe()" />

    <p>Klõpsa kaardil, et valida koht.</p>
    <div id="kaardikiht" style="height: 500px;"></div>

    <p>Kaugused linnulennult:</p>
    <div id="vastus"></div>
  </body>
</html>
