<!DOCTYPE html>
<html>
 <head>
 <meta charset="utf-8" />
 <title>Kaart</title>
 <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.5.1/leaflet.js"></script>
 <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.5.1/leaflet.css" />
 <style>
   body {padding: 0; margin: 0;}
   html, body {height: 100%; width: 100%;}
   #kaardikiht {width: 100%; height: 100%;}
 </style>
 <script>
   let kaart;
   let hypik;
   let marker1;
   let grupp;
   let markerigrupp;
   let kohad=[];
   let aadress="https://script.google.com/macros/s/AKfycbwTZWUCvoDEbHj0QGU4c1vL5Sk20HzcqUTxf8d6r0wHdIERk9GMCaz780a52yulWqQS/exec";

   function algus(){
     kaart=L.map('kaardikiht').setView([58.9, 22.6], 10);
     new L.TileLayer(
       'https://tiles.maaamet.ee/tm/tms/1.0.0/hybriid@GMC/{z}/{x}/{y}.png&ASUTUS=TLU&ERIALA=DIGIHUMANITAARIA', {
         attribution: "Map: <a href='http://www.maaamet.ee/'>Maa-amet</a>",
         tms: true
       }).addTo(kaart);

     marker1=L.marker([58.9, 22.6], {draggable: true});
     marker1.addTo(kaart);
     marker1.on("dragend", liikumine);

     grupp=L.layerGroup();
     grupp.addTo(kaart);
     markerigrupp=L.layerGroup();
     markerigrupp.addTo(kaart);

     hypik=L.popup();
     kaart.on("click", vajutus);
     loe();
   }

   function loe(){
     fetch(aadress).then(d => d.json()).then(kuva);
   }

   function kuva(andmed){
     kohad=andmed;
     markerigrupp.clearLayers();

     for(let i=0; i<kohad.length; i++){
       L.marker([kohad[i][0], kohad[i][1]])
         .addTo(markerigrupp)
         .bindPopup(kohad[i][2]+" "+kohad[i][3]);
     }

     liikumine();
   }

   function liikumine(){
     selgitus.innerText="";
     grupp.clearLayers();
     let koht1=marker1.getLatLng();

     for(let i=0; i<kohad.length; i++){
       let koht2=L.latLng(kohad[i][0], kohad[i][1]);
       selgitus.innerText+=kohad[i][2]+": "+
         Math.round(koht1.distanceTo(koht2))/1000+" km\n";
       L.polyline([koht1, koht2]).addTo(grupp);
     }
   }

   function vajutus(e){
     hypik.setLatLng(e.latlng)
       .setContent("Vajutasid "+e.latlng.toString()).openOn(kaart);
     marker1.setLatLng(e.latlng);
     liikumine();
   }

   function salvesta(){
     let koht1=marker1.getLatLng();
     let lisand="?laiuskraad="+koht1.lat+
       "&pikkuskraad="+koht1.lng+
       "&tyyp="+encodeURIComponent(tyyp.value)+
       "&kommentaar="+encodeURIComponent(kast.value);

     fetch(aadress+lisand).then(d => d.json()).then(kuva);
   }
 </script>
 </head>
 <body onload="algus()">
   Koha nimi: <input id="tyyp" />
   Kirjeldus: <input id="kast" />
   <input type="button" value="Salvesta" onclick="salvesta()" />
   <input type="button" value="Uuenda" onclick="loe()" />
   <div id="selgitus">selgituse koht</div>
   <div id="kaardikiht"></div>
 </body>
</html>
