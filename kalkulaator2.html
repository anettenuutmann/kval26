<!doctype html>
<html>
  <head>
    <title>Lemmiklooma maiuste hinnaleidja</title>

    <style>
      body {
        background-color: #dff3fa;
        color: #453739;
        font-family: Georgia;
        padding: 20px;
      }

      h1 {
        background-color: #f5b8c8;
        padding: 18px;
        text-align: center;
        border: 3px solid #d4a94f;
        border-radius: 10px;
      }

      .kalkulaator {
        background-color: #fff5f8;
        padding: 20px;
        border: 2px solid #d4a94f;
        border-radius: 10px;
      }

      input {
        padding: 8px;
        margin: 5px;
      }

      #vastus {
        color: #a47719;
        font-weight: bold;
      }

      a {
        color: #a47719;
        font-weight: bold;
      }

      img {
        width: 300px;
        height: 250px;
        object-fit: contain;
        object-position: center;
        background-color: white;
        border: 3px solid #f5b8c8;
        border-radius: 8px;
        margin-top: 20px;
      }
    </style>

    <script>
      function arvutus(){
        vastus.innerText="Maiused maksavad kokku "+(kogus.valueAsNumber*3)+" eurot";
      }
    </script>
  </head>

  <body>
    <h1>Lemmiklooma maiuste hinnaleidja 🐾</h1>

    <div class="kalkulaator">
      <p>Üks pakk lemmiklooma maiuseid maksab 3 eurot.</p>

      Mitu pakki soovid osta? <br />

      <input type="number" id="kogus" />
      <input type="button" value="Arvuta" onclick="arvutus()" />

      <span id="vastus">Vastus ilmub siia</span>
    </div>
    <br /><br />

    <a href="sisukord.html">Tagasi sisukorda</a>
  </body>
</html>
